name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UI and RSS browser tests
        run: pnpm test:ui --workers=2
      - name: Upload failed browser test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Rust and sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential pkg-config bubblewrap apparmor-utils
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Generate news and build frontend for the native app
        run: pnpm build
      - name: Check Rust formatting, lint and tests
        run: |
          mise run rust-format
          mise run rust-lint
          mise run rust-test
      - name: Verify generated RSS with the launcher parser
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib commands::news::launcher::tests::generated_launcher_feed -- --ignored --exact
      - name: Build native app and platform probes
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --bins --features tauri/custom-protocol
      - name: Verify AppContainer isolation
        if: runner.os == 'Windows'
        run: ./src-tauri/target/debug/sandbox_probe.exe --appcontainer
      - name: Verify Windows authentication IPC in an actual AppContainer JVM
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --locked --lib auth::broker::windows_smoke::appcontainer_java_uses_inherited_auth_channel -- --ignored --exact --nocapture
      - name: Verify official Minecraft 1.21.8 signing in AppContainer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/auth-broker-probe/prepare_chat_smoke.py 1.21.8 "$env:RUNNER_TEMP/auth-chat-classes"
          $env:MONALAUNCHER_CHAT_SMOKE_ROOT = "$env:RUNNER_TEMP/auth-chat-classes"
          $env:MONALAUNCHER_CHAT_SMOKE_JAVA = "$env:JAVA_HOME/bin/java.exe"
          $env:MONALAUNCHER_CHAT_SMOKE_VERSION = "1.21.8"
          Set-Location src-tauri
          cargo test --locked --lib auth::broker::interop::official_game_chat_signer_uses_opaque_key_over_real_ipc -- --ignored --exact --nocapture
      - name: Install Java 25 for Minecraft 26.2 signing probe
        if: runner.os == 'Windows'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify official Minecraft 26.2 signing in AppContainer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/auth-broker-probe/prepare_chat_smoke.py 26.2 "$env:RUNNER_TEMP/auth-chat-classes"
          $env:MONALAUNCHER_CHAT_SMOKE_ROOT = "$env:RUNNER_TEMP/auth-chat-classes"
          $env:MONALAUNCHER_CHAT_SMOKE_JAVA = "$env:JAVA_HOME/bin/java.exe"
          $env:MONALAUNCHER_CHAT_SMOKE_VERSION = "26.2"
          Set-Location src-tauri
          cargo test --locked --lib auth::broker::interop::official_game_chat_signer_uses_opaque_key_over_real_ipc -- --ignored --exact --nocapture
      - name: Verify Windows sandbox ACL boundaries
        if: runner.os == 'Windows'
        run: ./src-tauri/target/debug/sandbox_probe.exe --acl
      - name: Verify Windows child cleanup after launcher exit
        if: runner.os == 'Windows'
        run: ./scripts/verify-windows-job.ps1
      - name: Verify Linux sandbox as an unprivileged user
        if: runner.os == 'Linux'
        run: |
          test "$(id -u)" -ne 0
          sudo install -d -o root -g root -m 755 /usr/local/libexec/monalauncher-probes
          sudo install -o root -g root -m 755 src-tauri/target/debug/linux_sandbox_probe /usr/local/libexec/monalauncher-probes/linux_sandbox_probe
          if sudo aa-status --enabled; then
            sudo apparmor_parser -r tools/linux-validation/monalauncher-probes.apparmor
          fi
          /usr/local/libexec/monalauncher-probes/linux_sandbox_probe

  check:
    name: Project checks
    if: always()
    needs: [frontend, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$NATIVE_RESULT" = success
