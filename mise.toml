[tools]
node = "24.18.0"
pnpm = "11.20.0"

[tasks.dev]
description = "Start the Tauri development app"
run = "pnpm tauri dev"

[tasks.build]
description = "Build the Tauri application"
run = "pnpm tauri build"

[tasks.frontend-format]
description = "Check frontend formatting"
run = "pnpm format:check"

[tasks.frontend-lint]
description = "Lint frontend"
run = "pnpm lint"

[tasks.frontend-build]
description = "Type-check and build frontend"
run = "pnpm build"

[tasks.rust-format]
description = "Check Rust formatting"
run = "cargo fmt --manifest-path src-tauri/Cargo.toml --all --check"

[tasks.rust-lint]
description = "Run Clippy"
run = "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings"

[tasks.rust-test]
description = "Run Rust tests"
run = "cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked"

[tasks.check]
description = "Run all project checks"
depends = [
  "frontend-format",
  "frontend-lint",
  "frontend-build",
  "rust-format",
  "rust-lint",
  "rust-test",
]
